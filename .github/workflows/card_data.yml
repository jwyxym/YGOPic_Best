name: build card_data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Git Config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"

    - name: Set SSH Key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
  
    - name: build
      run: |
        cd core-wasm
        git clone ${{ secrets.PIC_URL }} --depth 1
        cargo run --release -- hd-arts/arts

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: card_data
        retention-days: 1
        path: ./core-wasm/card_data

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Create card_data
        run: |
          cd build
          gh release delete hash-latest --cleanup-tag -y || true
          gh release create hash-latest $(find . -type f) \
            --target "$GITHUB_SHA" \
            --title "card_data" \
            --notes "Latest build for ${{ github.ref_name }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-to-bucket:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Upload to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: card_data
          file_path: ./build/card_data/card_data

  flush-cdn:
    runs-on: ubuntu-latest
    needs: push-to-bucket
    steps:
      - uses: actions/checkout@v4

      - uses: jwyxym/jwyxym/edgeone-cache@master
        with:
          secret_id: ${{ secrets.EDGE_ID }}
          secret_key: ${{ secrets.EDGE_KEY }}
          zone_id: ${{ secrets.EDGE_ZONE_ID }}
          url_target: ${{ secrets.EDGE_URL }}
          flush_type: "purge_url"

      - uses: jwyxym/jwyxym/aliyun-esa-cache@master
        with:
          access_key_id: ${{ secrets.ESA_ID }}
          access_key_secret: ${{ secrets.ESA_KEY }}
          site_id: ${{ secrets.ESA_SITE_ID }}
          flush_type: "file"